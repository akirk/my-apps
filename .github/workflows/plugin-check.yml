name: Plugin Check

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: plugin-check-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin-check:
    name: WordPress.org directory checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Apply the release exclusions so development files and listing assets
      # are not checked as if they were shipped in the plugin ZIP.
      # My Apps currently has no production Composer dependencies.
      - name: Build the release tree
        run: |
          mkdir -p build/my-apps
          git archive HEAD | tar -x -C build/my-apps

      - name: Run Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: ./build/my-apps
